name: Deploy

# Deploys main with Kamal after CI passes, or on demand from the Actions tab.
# Off until the repository variable KAMAL_ENABLED is "true", so new projects
# made from this template don't try to deploy before they have a server.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # For workflow_run, only deploy CI runs from a push to this repository.
    # `branches: [main]` alone would also match a pull request from a fork
    # whose branch happens to be named main, and the scheduled CI runs.
    if: >-
      vars.KAMAL_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    # Must match builder.arch in config/deploy.yml (ubuntu-24.04-arm for arm64).
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: "3.4"
      - run: gem install kamal -v 2.12.0
      - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - run: kamal deploy
