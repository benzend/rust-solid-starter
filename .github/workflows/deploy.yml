name: Deploy

# Deploys main with Kamal after CI passes, or on demand from the Actions tab.
# Off until the repository variable KAMAL_ENABLED is "true", so new projects
# made from this template don't try to deploy before they have a server.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.KAMAL_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    # Must match builder.arch in config/deploy.yml (ubuntu-24.04-arm for arm64).
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - run: gem install kamal -v 2.12.0
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - uses: docker/setup-buildx-action@v4
      - run: kamal deploy
