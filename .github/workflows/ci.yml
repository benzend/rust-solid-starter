name: CI

# Third-party actions are pinned to commit hashes (a tag can be moved to new
# code; a hash can't). Dependabot keeps the hashes current.

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so new advisories against existing dependencies show up even when
  # nothing is being merged.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      DATABASE_URL: postgres://app:app@localhost:5432/app
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: server
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --version ^0.9 --no-default-features --features rustls,postgres --locked
      - name: Run migrations
        run: cargo sqlx migrate run
      - name: .sqlx query cache matches the schema
        run: cargo sqlx prepare --check -- --all-targets
      - run: cargo test
      - name: Generated TypeScript types are up to date
        run: git diff --exit-code -- ../web/src/types

  # Known vulnerabilities, license allow-list, and allowed sources for Rust
  # crates (server/deny.toml). npm packages are covered by Dependabot alerts.
  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: server/Cargo.toml

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # Installs the pnpm version pinned in package.json's "packageManager".
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
          cache: true
          cache_dependency_path: web/pnpm-lock.yaml
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
