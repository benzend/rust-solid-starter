[package]
name = "server"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "io-util"] }
tower-http = { version = "0.7", features = [
    "fs",
    "compression-gzip",
    "compression-br",
    "trace",
    "timeout",
    "set-header",
    "catch-panic",
    "request-id",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "macros",
    "migrate",
] }
thiserror = "2"
dotenvy = "0.15"
ts-rs = "12"
argon2 = "0.6"
rand = "0.10"
sha2 = "0.11"
hex = "0.4"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
serde_json = "1"

# The compiler refuses any `unsafe` block in this crate.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true
