# Dev:  `make db` starts only Postgres; run the server and Vite locally for hot reload.
# Prod-like: `docker compose up --build` runs Postgres + the app image together.
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app # dev-only credentials; use secrets in production
      POSTGRES_DB: app
    ports:
      - "127.0.0.1:5432:5432" # bound to localhost so it isn't exposed on your network
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 3s
      retries: 15

  app:
    build: .
    environment:
      DATABASE_URL: postgres://app:app@db:5432/app
      RUST_LOG: server=info,tower_http=info
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
